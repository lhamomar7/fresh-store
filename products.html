<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoothies - Our Smoothies</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-left">
            <img src="smoothie-logo.png" alt="Smoothies Logo" class="logo-img">
            <span class="logo-text">SMOOTHIES</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html" class="active">Our smoothies</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- ===== GALLERY - 3 תמונות עם מסגרת סגולה ===== -->
    <section class="gallery">
        <img src="smoothie1.jpg" alt="Smoothie 1">
        <img src="MSHOLASH1.jpg" alt="Smoothie 2">
        <img src="MESHOLASH2.jpg" alt="Smoothie 3">
    </section>

    <!-- ===== LIST OF DRINKS ===== -->
    <section class="drinks-list">
        <h2>List of Drinks</h2>
        <ul>
            <li>
                <span class="drink-icon"><i class="fa-solid fa-rocket"></i></span>
                <span>Aloha Pineapple</span>
            </li>
            <li>
                <span class="drink-icon"><i class="fa-solid fa-rocket"></i></span>
                <span>Caribbean Passion</span>
            </li>
            <li>
                <span class="drink-icon"><i class="fa-solid fa-rocket"></i></span>
                <span>Mango-a-go-go</span>
            </li>
            <li>
                <span class="drink-icon"><i class="fa-solid fa-rocket"></i></span>
                <span>Strawberries 'n Cream</span>
            </li>
        </ul>
    </section>

    <!-- ===== YOUR CHOICE ===== -->
    <section class="your-choice">
        <h2>Your Choice</h2>
        <div class="choice-box">
            <table class="choice-table">
                <tr>
                    <th>Size</th>
                    <th>Price</th>
                </tr>
                <tr>
                    <td>Small</td>
                    <td>$8</td>
                </tr>
                <tr>
                    <td>Medium</td>
                    <td>$12</td>
                </tr>
                <tr>
                    <td>Large</td>
                    <td>$16</td>
                </tr>
            </table>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="footer-col">
            <h4>WHO WE ARE</h4>
            <a href="#">About</a>
            <a href="#">Team</a>
            <a href="#">Work With Us</a>
            <div class="social-icons">
                <a href="https://twitter.com"><i class="fa-brands fa-twitter"></i></a>
                <a href="https://facebook.com"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://instagram.com"><i class="fa-brands fa-instagram"></i></a>
            </div>
            <p class="copyright">© 2024 SMOOTHIES</p>
        </div>
        <div class="footer-col">
            <h4>FOLLOW US</h4>
            <a href="https://twitter.com">Twitter</a>
            <a href="https://facebook.com">Facebook</a>
            <a href="https://instagram.com">Instagram</a>
        </div>
    </footer>

</body>
</html>
